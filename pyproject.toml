[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data-platform"
version = "0.1.0"
description = "Data platform for mazino2d projects: dlt + BigQuery + dbt, orchestrated from YAML DAGs"
requires-python = ">=3.11"
dependencies = [
    "dlt[bigquery,parquet]>=1.4",
    "google-cloud-firestore>=2.19",
    "dbt-core>=1.10,<1.11",
    "dbt-bigquery>=1.10,<1.11",
    "faker>=24",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    # Same minor as the sqlfluff-lint hook rev in .pre-commit-config.yaml
    "sqlfluff>=3.3,<3.4",
    "pre-commit>=3.0",
    "pip-tools>=7.0",
    "mkdocs-material[imaging]>=9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dag*"]
