name: DAG task

# Runs one task from dag/dags/ against prod BigQuery: `python -m dag.run <task>`
# handles the task's retries. Called by the generated dag-<pipeline>.yml
# workflows (python -m dag.render). Kept local because it needs id-token write
# for Workload Identity Federation.
on:
  workflow_call:
    inputs:
      task:
        type: string
        required: true
      dbt:
        description: Install dbt packages before running.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DBT_TARGET: prod
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: dbt deps
        if: inputs.dbt
        run: cd dbt && dbt deps --profiles-dir . --target prod
      - name: Run ${{ inputs.task }}
        env:
          TASK: ${{ inputs.task }}
        run: python -m dag.run "$TASK"
