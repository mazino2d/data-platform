name: Docker

# Builds the Dagster image on pull requests; pushes from main to GHCR and opens
# an auto-merging bump of the dev deployment in everything-as-code. stg/prod
# tags are bumped by hand there.
on:
  pull_request:
    branches: [main]
    paths: &image-paths
      - "dag/**"
      - "dbt/**"
      - "dlt/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths: *image-paths

permissions:
  contents: read

jobs:
  image:
    uses: mazino2d/github-workflows/.github/workflows/docker.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      context: .
      test-commands: |
        dagster definitions validate -m dag
        python -c "import dagster_postgres"

  bump-dev:
    needs: image
    if: github.event_name == 'push'
    uses: mazino2d/github-workflows/.github/workflows/gitops-bump.yml@v1
    with:
      tag: ${{ needs.image.outputs.tag }}
      values-file: kubernetes/clusters/mazino2d-as-se1-dev/apps/dagster/values.yaml
      app-id: ${{ vars.EAC_DEPLOYER_APP_ID }}
    secrets: inherit
