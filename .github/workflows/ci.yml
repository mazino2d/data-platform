name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    uses: mazino2d/github-workflows/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.11"
      paths: &ci-paths |
        dbt/**
        dlt/**
        pyproject.toml
        .pre-commit-config.yaml
        .github/workflows/ci.yml
      run: |
        cd dbt && dbt deps --profiles-dir .
        pre-commit run --all-files

  dbt:
    uses: mazino2d/github-workflows/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.11"
      paths: *ci-paths
      run: |
        cd dbt && dbt deps --profiles-dir .
        python dlt/pipeline.py
        cd dbt && dbt build --profiles-dir .

  workflows:
    if: github.event_name == 'pull_request'
    uses: mazino2d/github-workflows/.github/workflows/lint.yml@v1

  codeql:
    uses: mazino2d/github-workflows/.github/workflows/codeql-actions.yml@v1
    permissions:
      contents: read
      security-events: write
