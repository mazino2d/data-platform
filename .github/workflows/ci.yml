name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    uses: mazino2d/github-workflows/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.11"
      paths: |
        dag/**
        dbt/**
        dlt/**
        pyproject.toml
        .sqlfluff
        .pre-commit-config.yaml
        .github/workflows/**
      # sqlfluff first, as annotations, so SQL failures show on the PR without opening logs.
      # The pre-commit sqlfluff hook is skipped since the line above already linted.
      run: |
        sqlfluff lint dbt/models --format github-annotation-native
        SKIP=sqlfluff-lint pre-commit run --all-files
        python -m dag.render --check

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pipeline:
              - dbt/**
              - dlt/**
              - scripts/**
              - pyproject.toml
              - .github/workflows/ci.yml

  # Local rather than python-ci.yml: it needs id-token write for Workload
  # Identity Federation. Ingests and builds everything into throwaway ci_<run>_*
  # datasets in the dev project (the dev GitHub Environment), then drops them,
  # so CI never touches prd. The Firestore copy comes from simsplit-as-se1-dev,
  # topped up with fake data. Runs only when the pipeline changed, and never for
  # fork pull requests, which get no OIDC token (repo variables still reach them,
  # so the check is on the head repo, not on the variables).
  dbt:
    needs: changes
    if: >-
      needs.changes.outputs.pipeline == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      DBT_TARGET: ci
      DBT_CI_DATASET: ci_${{ github.run_id }}_${{ github.run_attempt }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SIMSPLIT_FIREBASE_PROJECT: ${{ vars.SIMSPLIT_FIREBASE_PROJECT }}
    steps:
      # Without the dev environment's variables, the repo-level ones (prd) apply.
      - name: Check environment
        run: |
          if [[ "$GCP_PROJECT_ID" != dataplatform-as-se1-dev || "$SIMSPLIT_FIREBASE_PROJECT" != simsplit-as-se1-dev ]]; then
            echo "::error::CI must use dataplatform-as-se1-dev and simsplit-as-se1-dev, not '$GCP_PROJECT_ID' and '$SIMSPLIT_FIREBASE_PROJECT'"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Ingest
        run: |
          python dlt/pipeline.py jaffle_shop
          python dlt/pipeline.py simsplit
          python dlt/pipeline.py simsplit_fake
      - name: dbt build
        run: |
          cd dbt
          dbt deps --profiles-dir .
          dbt build --profiles-dir . --target ci
      - name: Drop CI datasets
        if: always()
        run: python scripts/drop_datasets.py "$DBT_CI_DATASET"

  workflows:
    if: github.event_name == 'pull_request'
    uses: mazino2d/github-workflows/.github/workflows/lint.yml@v1

  codeql:
    uses: mazino2d/github-workflows/.github/workflows/codeql-actions.yml@v1
    permissions:
      contents: read
      security-events: write
