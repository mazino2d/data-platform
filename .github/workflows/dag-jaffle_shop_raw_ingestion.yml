    permissions:
      contents: read
      id-token: write
    with:
      task: jaffle_shop_raw_ingestion
      dbt: false
      environment: prd
      ref: ${{ needs.plan.outputs.prd_ref }}

  jaffle_shop_snapshots_prd:
    # Run SCD Type 2 snapshots for customers, orders, and products.
    needs: [plan, jaffle_shop_raw_ingestion_prd]
    if: needs.plan.outputs.prd == 'true'
    uses: ./.github/workflows/dag-task.yml
    permissions:
      contents: read
      id-token: write
    with:
      task: jaffle_shop_snapshots
      dbt: true
      environment: prd
      ref: ${{ needs.plan.outputs.prd_ref }}

  jaffle_shop_staging_prd:
    # Clean and normalize raw source data into staging views.
    needs: [plan, jaffle_shop_snapshots_prd]
    if: needs.plan.outputs.prd == 'true'
    uses: ./.github/workflows/dag-task.yml
    permissions:
      contents: read
      id-token: write
    with:
      task: jaffle_shop_staging
      dbt: true
      environment: prd
      ref: ${{ needs.plan.outputs.prd_ref }}

  jaffle_shop_intermediate_prd:
    # Business logic joins across staging models.
    needs: [plan, jaffle_shop_staging_prd]
    if: needs.plan.outputs.prd == 'true'
    uses: ./.github/workflows/dag-task.yml
    permissions:
      contents: read
      id-token: write
    with:
      task: jaffle_shop_intermediate
      dbt: true
      environment: prd
      ref: ${{ needs.plan.outputs.prd_ref }}

  jaffle_shop_core_prd:
    # Dimension and fact tables for reporting.
    needs: [plan, jaffle_shop_intermediate_prd]
    if: needs.plan.outputs.prd == 'true'
    uses: ./.github/workflows/dag-task.yml
    permissions:
      contents: read
      id-token: write
    with:
      task: jaffle_shop_core
      dbt: true
      environment: prd
      ref: ${{ needs.plan.outputs.prd_ref }}

  jaffle_shop_features_prd:
