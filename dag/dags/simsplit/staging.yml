name: simsplit_staging
description: "Clean the Firestore copy and the telemetry tables into staging views."
dbt_command: build
dbt_selector: "tag:simsplit,tag:staging"

trigger:
  type: upstream
  # In prd, where the fake task doesn't run, only simsplit_raw_ingestion.
  depends_on: [simsplit_raw_ingestion, simsplit_fake_ingestion]

retry:
  max_retries: 2
  retry_delay_minutes: 5
