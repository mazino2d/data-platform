name: jaffle_shop_intermediate
description: "Business logic joins across staging models."
dbt_command: build
dbt_selector: "tag:jaffle_shop,tag:intermediate"
# The SK maps are intermediate but staging reads them, so the staging task
# already built them.
dbt_exclude: "+tag:staging"

trigger:
  type: upstream
  depends_on: jaffle_shop_staging

retry:
  max_retries: 2
  retry_delay_minutes: 5
