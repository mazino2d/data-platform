# Theme and Markdown setup come from mazino2d/github-workflows (mkdocs/base.yml).
INHERIT: .mkdocs/base.yml

site_name: Data Engineering Blog
site_description: Principles and patterns in data engineering, demonstrated with a real pipeline.
site_url: https://mazino2d.github.io/data-platform/
site_author: mazino2d
copyright: Copyright &copy; 2025 mazino2d

theme:
  custom_dir: overrides

plugins:
  - search
  - meta
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{slug}"
      archive: false
      categories: false
      pagination: false

extra_javascript:
  - javascripts/back-link.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mazino2d/data-platform

nav:
  - Home: index.md
