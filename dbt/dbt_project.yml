name: data_platform
version: "1.0.0"
config-version: 2

profile: data_platform

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# One folder per project under models/, snapshots/ and seeds/. Each layer lands
# in its own BigQuery dataset named <project>_<layer> (see generate_schema_name).
models:
  data_platform:
    jaffle_shop:
      +tags: ["jaffle_shop"]
      staging:
        +schema: jaffle_shop_staging
        +materialized: view
        +tags: ["staging"]
      intermediate:
        +schema: jaffle_shop_intermediate
        +materialized: view
        +tags: ["intermediate"]
      marts:
        core:
          +schema: jaffle_shop_marts
          +materialized: table
          +tags: ["core"]
        features:
          +schema: jaffle_shop_features
          +materialized: table
          +tags: ["features"]

    # sim-split (R-4): the Firestore copy from dlt plus the telemetry endpoint's
    # error reports and usage events. Personal data: never in public outputs.
    simsplit:
      +tags: ["simsplit"]
      staging:
        +schema: simsplit_staging
        +materialized: view
        +tags: ["staging"]
      marts:
        core:
          +schema: simsplit_marts
          +materialized: table
          +tags: ["core"]

snapshots:
  data_platform:
    jaffle_shop:
      +schema: jaffle_shop_snapshots
      +tags: ["jaffle_shop", "snapshots"]

seeds:
  data_platform:
    jaffle_shop:
      +schema: jaffle_shop_seeds
      +tags: ["jaffle_shop"]
